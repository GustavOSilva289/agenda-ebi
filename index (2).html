<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda EBI - Novo Bandeirantes</title>
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda EBI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --indigo: #4f46e5;
    --indigo-escuro: #312e81;
    --fundo: #f5f6fb;
    --texto: #1e1b4b;
    --verde: #059669;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--fundo); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); }

  #app {
    position: fixed; inset: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--fundo);
  }
  #quadro { width: 100%; height: 100%; border: 0; display: block; background: var(--fundo); }

  /* carregando */
  #carregando {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--fundo);
    transition: opacity .3s ease;
  }
  #carregando.some { opacity: 0; pointer-events: none; }
  #carregando img { width: 88px; height: 88px; border-radius: 22px; }
  #carregando p { margin: 0; font-weight: 600; }
  .barra { width: 120px; height: 4px; border-radius: 4px; background: #dfe2f7; overflow: hidden; }
  .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--indigo);
                  animation: corre 1.1s ease-in-out infinite; }
  @keyframes corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

  /* aviso de instalação */
  #instalar {
    position: fixed; left: 12px; right: 12px; z-index: 10;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: none; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 16px;
    background: #fff; box-shadow: 0 8px 28px rgba(30, 27, 75, .22);
    max-width: 460px; margin: 0 auto;
  }
  #instalar.mostra { display: flex; }
  #instalar img { width: 44px; height: 44px; border-radius: 11px; flex: none; }
  #instalar .txt { flex: 1; min-width: 0; line-height: 1.25; }
  #instalar .txt strong { display: block; font-size: 15px; }
  #instalar .txt span { font-size: 13px; color: #5b5f86; }
  #btnInstalar {
    border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer;
    background: var(--indigo); color: #fff; font: inherit; font-weight: 700; font-size: 14px;
  }
  #btnInstalar:focus-visible, #btnFechar:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
  #btnFechar {
    border: 0; background: transparent; color: #5b5f86; cursor: pointer;
    font-size: 22px; line-height: 1; padding: 4px 6px;
  }

  /* sem internet */
  #offline {
    position: fixed; inset: 0; z-index: 8; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 24px; text-align: center; background: var(--fundo);
  }
  #offline.mostra { display: flex; }
  #offline h2 { margin: 0; font-size: 20px; }
  #offline p { margin: 0; color: #5b5f86; max-width: 320px; }
  #offline button {
    margin-top: 8px; border: 0; border-radius: 12px; padding: 12px 20px;
    background: var(--indigo); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <iframe id="quadro" title="Agenda EBI - Novo Bandeirantes"
          allow="clipboard-write; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<div id="carregando">
  <img src="icon-192.png" alt="">
  <p>Agenda EBI</p>
  <div class="barra"></div>
</div>

<div id="offline">
  <h2>Sem conexão</h2>
  <p>A agenda precisa de internet para abrir. Conecte-se e tente de novo.</p>
  <button id="btnTentar">Tentar de novo</button>
</div>

<div id="instalar" role="dialog" aria-label="Instalar aplicativo">
  <img src="icon-192.png" alt="">
  <div class="txt">
    <strong>Instalar aplicativo</strong>
    <span id="dica">Abra a Agenda EBI direto da tela inicial.</span>
  </div>
  <button id="btnInstalar" type="button">Instalar aplicativo</button>
  <button id="btnFechar" type="button" aria-label="Fechar">×</button>
</div>

<script>
  // ============================================================
  // URL do Web App da Agenda EBI (Apps Script)
  // ============================================================
  var URL_AGENDA = 'https://script.google.com/macros/s/AKfycbw130JRtU8GqRBxlKeJSLCgcLmmz0uvEmmdL6_Pyy5i9zw6PDb9sVtJRCZuu1TShHhY5A/exec';
  // ============================================================

  var quadro = document.getElementById('quadro');
  var carregando = document.getElementById('carregando');
  var offline = document.getElementById('offline');

  function abrirAgenda() {
    if (!navigator.onLine) { offline.classList.add('mostra'); return; }
    offline.classList.remove('mostra');
    carregando.classList.remove('some');
    quadro.src = URL_AGENDA;
  }
  quadro.addEventListener('load', function () {
    setTimeout(function () { carregando.classList.add('some'); }, 250);
  });
  document.getElementById('btnTentar').addEventListener('click', abrirAgenda);
  window.addEventListener('online', abrirAgenda);
  window.addEventListener('offline', function () { offline.classList.add('mostra'); });
  abrirAgenda();

  // ---------- service worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  // ---------- botão "Instalar aplicativo" ----------
  var aviso = document.getElementById('instalar');
  var btnInstalar = document.getElementById('btnInstalar');
  var dica = document.getElementById('dica');
  var promptInstalar = null;

  var jaInstalado = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
  var dispensado = false;
  try { dispensado = sessionStorage.getItem('ebi-agenda-dispensou') === '1'; } catch (e) {}

  function mostrarAviso() {
    if (jaInstalado || dispensado) return;
    aviso.classList.add('mostra');
  }

  // Android / Chrome / Edge: o navegador avisa quando dá para instalar
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    promptInstalar = e;
    mostrarAviso();
  });

  btnInstalar.addEventListener('click', function () {
    if (promptInstalar) {
      promptInstalar.prompt();
      promptInstalar.userChoice.then(function () {
        promptInstalar = null;
        aviso.classList.remove('mostra');
      });
    }
  });

  window.addEventListener('appinstalled', function () { aviso.classList.remove('mostra'); });

  document.getElementById('btnFechar').addEventListener('click', function () {
    aviso.classList.remove('mostra');
    try { sessionStorage.setItem('ebi-agenda-dispensou', '1'); } catch (e) {}
  });

  // iPhone/iPad (Safari): não existe botão automático, então mostramos o passo a passo
  var ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ehIOS && !jaInstalado) {
    dica.textContent = 'Toque em Compartilhar e depois em "Adicionar à Tela de Início".';
    btnInstalar.style.display = 'none';
    mostrarAviso();
  }
</script>
</body>
</html>
